name: chatisen-coturn

services:
  coturn:
    image: coturn/coturn:4.6.2
    container_name: chatisen-coturn
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/coturn/entrypoint.sh"]
    command:
      - -c
      - /run/coturn/turnserver.conf
      - --realm=${TURN_REALM:?Set TURN_REALM}
      - --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP}/${TURN_INTERNAL_IP:?Set TURN_INTERNAL_IP}
      - --relay-ip=${TURN_INTERNAL_IP:?Set TURN_INTERNAL_IP}
      - --log-file=stdout
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49252:49152-49252/udp"
      # J1: loopback only. Dedicated TURN VM: bind to its private interface address.
      - "${TURN_METRICS_BIND_IP:-127.0.0.1}:9641:9641/tcp"
    secrets:
      - turn_shared_secret
    tmpfs:
      - /run/coturn:rw,noexec,nosuid,size=1m
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./entrypoint.sh:/etc/coturn/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9641/metrics >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      turn:
        ipv4_address: 172.30.0.10
      observability:
        aliases: [coturn]

secrets:
  turn_shared_secret:
    file: ${TURN_SECRET_FILE:-./.turn_shared_secret}

networks:
  turn:
    name: chatisen-turn
    ipam:
      config:
        - subnet: 172.30.0.0/24
  observability:
    name: chatisen-observability
    external: true
