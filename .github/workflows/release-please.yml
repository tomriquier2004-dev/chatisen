name: Release

on:
  push:
    branches: [main]

# Aucun droit par défaut ; le job ne reçoit que ce dont release-please a besoin.
permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit du CHANGELOG, tag et release GitHub
      pull-requests: write   # ouverture et mise à jour de la Release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
