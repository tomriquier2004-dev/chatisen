name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-hygiene:
    name: PR hygiene
    # Ignorée pour Dependabot et pour la seule Release PR de release-please (corps généré) :
    # branche `release-please--*` ET titre `chore(main): release …`.
    if: "github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !(startsWith(github.head_ref, 'release-please--') && startsWith(github.event.pull_request.title, 'chore(main): release '))"
    runs-on: ubuntu-latest
    steps:
      - name: Titre au format Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|test|refactor|perf|build|ci|chore)(\([a-z0-9._-]+\))?!?: .+'
          if ! [[ "$TITLE" =~ $re ]]; then
            echo "::error::Titre de PR invalide : « $TITLE ». Attendu : type(scope): description (voir CONTRIBUTING.md)."
            exit 1
          fi
      - name: Issue liée et exigence référencée
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$BODY"; then
            echo "::error::La PR doit contenir « Closes #<n> » (issue liée)."
            exit 1
          fi
          if ! grep -Eq '\b(FR|NFR|SEC)-[0-9]{2}\b' <<<"$BODY"; then
            echo "::error::La PR doit référencer au moins une exigence (FR-xx, NFR-xx ou SEC-xx)."
            exit 1
          fi

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan
        run: semgrep scan --config p/default --error --metrics=off

  quality:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Base et cache jetables pour les tests d'intégration de l'API (mot de passe de test, sans valeur).
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: chatisen
          POSTGRES_USER: chatisen
          POSTGRES_PASSWORD: chatisen-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatisen -d chatisen"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://chatisen:chatisen-ci@127.0.0.1:5432/chatisen
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version lue dans packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Installation (lockfile figé)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Tests de l'analyse qualité (Python)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build
        run: pnpm build

  # À ajouter au fil des phases (voir issues du milestone « 3 - Application ») :
  #   build image Docker -> Trivy -> push registry -> deploy
