name: E2E

# Parcours de la messagerie dans de vrais navigateurs (issue #81) : API + client + Postgres + Redis.
# Lancé sur les PR qui touchent l'application ou les contrats.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: chatisen
          POSTGRES_USER: chatisen
          POSTGRES_PASSWORD: chatisen-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatisen -d chatisen"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://chatisen:chatisen-ci@127.0.0.1:5432/chatisen
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TURN_SHARED_SECRET: chatisen-e2e-shared-secret-0123456789abcdef
      TURN_URLS: turn:127.0.0.1:3478?transport=udp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Installation (lockfile figé)
        run: pnpm install --frozen-lockfile
      - name: Navigateur Chromium
        run: pnpm --filter @chatisen/web exec playwright install --with-deps chromium
      - name: Démarrer coturn pour les appels WebRTC
        run: |
          docker run -d --network host --name chatisen-coturn \
            coturn/coturn:4.6.2 \
            -n --log-file=stdout --fingerprint --use-auth-secret \
            --static-auth-secret=chatisen-e2e-shared-secret-0123456789abcdef \
            --realm=chatisen.test --listening-port=3478 --listening-ip=127.0.0.1 \
            --relay-ip=127.0.0.1 --external-ip=127.0.0.1 --allow-loopback-peers \
            --min-port=49160 --max-port=49200 --no-tls --no-dtls --no-cli
          for i in $(seq 1 15); do
            if docker logs chatisen-coturn 2>&1 | grep -q "Listener address"; then exit 0; fi
            sleep 1
          done
          docker logs chatisen-coturn
          exit 1
      - name: Tests e2e
        run: pnpm --filter @chatisen/web test:e2e
      - name: Captures clair / sombre de l'interface d'appel
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: call-ui-screenshots
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
